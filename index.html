 return {airHotel:Math.round(adjustedAirHotel),local:Math.round(local),tickets:ticket,buffer,total:Math.round(adjustedAirHotel+local+ticket+buffer)};

   if([5,6,7].includes(month))base=19.0;

   else base=18.0;
 } else {
   base=18.1;

 return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;

function airportTimeline(c,returnDate,flightTimeText){

 let hh=18,mm=0;
 if(/^\d{2}:\d{2}$/.test(flightTimeText||"")){
   [hh,mm]=flightTimeText.split(":").map(Number);
 }else{
   const m=(flightTimeText||"").match(/(\d{2})[:：](\d{2})/g);
   if(m&&m.length){const last=m[m.length-1].match(/(\d{2})[:：](\d{2})/);hh=+last[1];mm=+last[2];}
 }
 const dep=new Date(returnDate+"T"+String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0")+":00");
 const airport=new Date(dep.getTime()-p.arriveBefore*60000);
 const leaveHotel=new Date(airport.getTime()-(p.cityToAirport+p.buffer)*60000);
 const checkout=new Date(leaveHotel.getTime()-45*60000);
 const fmtTime=d=>d.toTimeString().slice(0,5);
 return {checkout:fmtTime(checkout),leaveHotel:fmtTime(leaveHotel),airport:fmtTime(airport),depart:fmtTime(dep),arriveBefore:p.arriveBefore,city:p.cityToAirport};
}

function daysUntil(dateStr){

function bookingSignal(c,startDate,currentPrice){
 const b=bookingTiming[c[0]],lead=daysUntil(startDate),m=new Date(startDate+"T12:00:00").getMonth()+1;
 const price=+currentPrice||((c[8]+c[9])/2);
 const ratio=(price-b.priceBandLow)/(b.priceBandHigh-b.priceBandLow||1);
 const high=b.highSeasonMonths.includes(m);
 if(ratio<=0.35 || lead<=Math.max(30,b.idealLeadDays*.35) || high&&lead<60)return {cls:"bookNow",label:"偏向現在訂",reason:"價格接近低檔／出發日接近／旺季風險提高"};
 if(ratio>=0.8 && lead>b.idealLeadDays*.6)return {cls:"bookHigh",label:"目前偏貴",reason:"價格接近高檔，且仍有等待空間"};
 return {cls:"bookWait",label:"可再觀察",reason:"價格與時間均處中間區間"};
}

function route(){const h=location.hash||"#home";if(h==="#home")renderHome();else if(h==="#compare")renderCompare();else if(h==="#saved")renderSaved();else if(h==="#planner")renderPlanner();else if(h==="#family")renderFamily();else if(h==="#watch")renderWatch();else if(h==="#offline")renderOffline();else if(h==="#orders")renderOrders();else if(h==="#assistant")renderAssistant();else if(h==="#dynamic")renderDynamic();else if(h==="#expenses")renderExpenses();else if(h.startsWith("#city-"))renderCity(+h.split("-")[1]);else renderHome()}
